[project]
name = "zabbix-netbox-map-sync"
version = "0.1.0"
description = "Create or update Zabbix maps from NetBox topology views"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
  "requests>=2.31.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "httpx>=0.27.0"
]

[project.scripts]
zbx-map-sync = "zabbix_map_sync.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["zabbix_map_sync*"]

[tool.setuptools.package-data]
zabbix_map_sync = ["templates/*.html", "templates/partials/*.html", "static/*"]
