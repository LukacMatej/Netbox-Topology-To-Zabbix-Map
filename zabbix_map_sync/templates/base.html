<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# Swap error responses too, so 4xx/5xx partials (validation, sync failures) are shown instead of dropped. #}
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"...","swap":true}]}'>
  <title>{% block title %}Zabbix Map Sync{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
</head>
<body>
  <div class="page {% block page_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
